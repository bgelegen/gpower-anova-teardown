name: testler

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Kur
        run: python -m pip install -e ".[test]"
      - name: CLI duman testi
        run: gpower-clone --test anova-oneway --mode a-priori --f 0.25 --alpha 0.05 --power 0.95 --groups 3
      - name: Tüm testler (oracle, özellik, MCP = CLI, R-18)
        shell: bash
        run: |
          set -o pipefail
          python -c "import platform, scipy; print(platform.platform(), 'Python', platform.python_version(), 'scipy', scipy.__version__)" | tee pytest.log
          python -m pytest -q -rfEx --tb=short 2>&1 | tee -a pytest.log
      - name: Özet
        if: always()
        shell: bash
        run: |
          echo '### ${{ matrix.os }} · Python ${{ matrix.python }}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          head -1 pytest.log >> "$GITHUB_STEP_SUMMARY"
          grep -E "^(FAILED|ERROR|XFAIL)|passed|failed" pytest.log | tail -25 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=ortam::$(head -1 pytest.log)"
          grep -E "^(FAILED|ERROR)" pytest.log | head -10 | while IFS= read -r l; do echo "::error title=pytest::$l"; done
          grep -E "^E  " pytest.log | head -6 | while IFS= read -r l; do echo "::warning title=ayrıntı::$l"; done
